    @keyframes cclFoxBlinkK{0%,87%,100%{transform:scaleY(1)}91%{transform:scaleY(.08)}}
    @media (prefers-reduced-motion:reduce){.cclFoxBob,.cclFoxBlink{animation:none}}
  </style>
