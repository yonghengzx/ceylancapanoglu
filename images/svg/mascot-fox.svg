<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Ceylan the fox mascot">
  <title>Ceylan the fox mascot</title>
  <style>
    .cclFoxBob{transform-box:fill-box;transform-origin:center;animation:cclFoxBobK 3.4s ease-in-out infinite}
