<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Lumi the bunny mascot">
  <title>Lumi the bunny mascot</title>
  <style>
    .cclBunnyBob{transform-box:fill-box;transform-origin:center;animation:cclBunnyBobK 3.5s ease-in-out infinite}
    .cclBunnyBlink{transform-box:fill-box;transform-origin:center;animation:cclBunnyBlinkK 5s ease-in-out infinite}
    @keyframes cclBunnyBobK{0%,100%{transform:translateY(0) rotate(1.2deg)}50%{transform:translateY(-4.5px) rotate(-1.4deg)}}
    @keyframes cclBunnyBlinkK{0%,86%,100%{transform:scaleY(1)}90%{transform:scaleY(.08)}}
    @media (prefers-reduced-motion:reduce){.cclBunnyBob,.cclBunnyBlink{animation:none}}
  </style>
  <ellipse cx="64" cy="121" rx="31" ry="5" fill="#2A2233" opacity=".15"/>
  <g class="cclBunnyBob">
    <path d="M16 124c4-18 24-27 48-27s44 9 48 27z" fill="#FFB6C9" stroke="#E0889F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M46 32C37 8 39 3 46 5c8 3 12 15 12 24z" fill="#FFB6C9" stroke="#E0889F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M82 32c9-24 7-29 0-27-8 3-12 15-12 24z" fill="#FFB6C9" stroke="#E0889F" stroke-width="3" stroke-linejoin="round"/>
    <path d="M48 27c-4-14-4-17 0-16 4 2 7 10 7 15z" fill="#FF8FB1"/>
    <path d="M80 27c4-14 4-17 0-16-4 2-7 10-7 15z" fill="#FF8FB1"/>
    <path d="M64 32c24 0 38 15 38 34 0 21-17 36-38 36s-38-15-38-36c0-19 14-34 38-34z" fill="#FFB6C9" stroke="#E0889F" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="40" cy="78" rx="7.5" ry="4.5" fill="#FF7FA8" opacity=".5"/>
    <ellipse cx="88" cy="78" rx="7.5" ry="4.5" fill="#FF7FA8" opacity=".5"/>
    <g class="cclBunnyBlink">
      <ellipse cx="50" cy="66" rx="6" ry="7" fill="#2A2233"/>
      <ellipse cx="78" cy="66" rx="6" ry="7" fill="#2A2233"/>
      <circle cx="48" cy="63.5" r="2.2" fill="#FFFFFF"/>
      <circle cx="76" cy="63.5" r="2.2" fill="#FFFFFF"/>
      <circle cx="52" cy="69" r="1.3" fill="#FFFFFF" opacity=".85"/>
      <circle cx="80" cy="69" r="1.3" fill="#FFFFFF" opacity=".85"/>
    </g>
    <path d="M59 80h10l-5 6z" fill="#E0668A"/>
    <path d="M64 86v4m0 0c-3 4-8 2-10-2m10 2c3 4 8 2 10-2" fill="none" stroke="#2A2233" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
