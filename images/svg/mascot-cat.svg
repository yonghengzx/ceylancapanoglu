      <circle cx="45" cy="63" r="2.6" fill="#FFFFFF"/>
      <circle cx="79" cy="63" r="2.6" fill="#FFFFFF"/>
      <circle cx="49" cy="69" r="1.4" fill="#FFFFFF" opacity=".85"/>
      <circle cx="83" cy="69" r="1.4" fill="#FFFFFF" opacity=".85"/>
    </g>
