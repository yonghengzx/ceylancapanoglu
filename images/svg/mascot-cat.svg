    <path d="M54 30v10M64 26v12M74 30v10" fill="none" stroke="#6F7FC8" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="34" cy="80" rx="8" ry="5" fill="#FF9EAE" opacity=".55"/>
    <ellipse cx="94" cy="80" rx="8" ry="5" fill="#FF9EAE" opacity=".55"/>
    <g class="cclCatBlink">
