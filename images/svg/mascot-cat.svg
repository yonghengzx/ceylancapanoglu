<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Suki the cat mascot">
  <title>Suki the cat mascot</title>
  <style>
    .cclCatBob{transform-box:fill-box;transform-origin:center;animation:cclCatBobK 3.8s ease-in-out infinite}
    .cclCatBlink{transform-box:fill-box;transform-origin:center;animation:cclCatBlinkK 5.4s ease-in-out infinite}
    @keyframes cclCatBobK{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1.1deg)}}
    @keyframes cclCatBlinkK{0%,88%,100%{transform:scaleY(1)}92%{transform:scaleY(.08)}}
    @media (prefers-reduced-motion:reduce){.cclCatBob,.cclCatBlink{animation:none}}
  </style>
  <ellipse cx="64" cy="121" rx="33" ry="5.5" fill="#2A2233" opacity=".15"/>
