<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Cinematic hero light orb">
  <title>Hero light orb</title>
  <defs>
    <radialGradient id="heroCore" cx="42%" cy="36%" r="62%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".92"/>
      <stop offset="22%" stop-color="#8FB4FF" stop-opacity=".72"/>
      <stop offset="55%" stop-color="#00E0C6" stop-opacity=".30"/>
      <stop offset="80%" stop-color="#7A5CFF" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#7A5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heroRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8CFF" stop-opacity=".75"/>
      <stop offset="50%" stop-color="#00E0C6" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#7A5CFF" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="heroArc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00E0C6" stop-opacity="0"/>
      <stop offset="45%" stop-color="#00E0C6" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#7A5CFF" stop-opacity=".1"/>
    </linearGradient>
    <filter id="heroBlur" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <circle cx="400" cy="400" r="300" fill="url(#heroCore)"/>
  <circle cx="400" cy="400" r="150" fill="#FFFFFF" opacity=".10" filter="url(#heroBlur)"/>
  <g fill="none" stroke="url(#heroRing)">
    <circle cx="400" cy="400" r="248" stroke-width="1.6"/>
    <circle cx="400" cy="400" r="310" stroke-width="1" opacity=".45"/>
    <circle cx="400" cy="400" r="366" stroke-width="1" opacity=".22"/>
  </g>
  <path d="M400 90a310 310 0 0 1 268 469" fill="none" stroke="url(#heroArc)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M400 152a248 248 0 0 0-215 375" fill="none" stroke="url(#heroArc)" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>
  <circle cx="648" cy="152" r="7" fill="#00E0C6" opacity=".85"/>
  <circle cx="152" cy="648" r="5" fill="#7A5CFF" opacity=".7"/>
</svg>
