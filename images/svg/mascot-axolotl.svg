<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Cora the axolotl mascot">
  <title>Cora the axolotl mascot</title>
  <style>
    .cclAxoBob{transform-box:fill-box;transform-origin:center;animation:cclAxoBobK 3.6s ease-in-out infinite}
    .cclAxoBlink{transform-box:fill-box;transform-origin:center;animation:cclAxoBlinkK 5.6s ease-in-out infinite}
    @keyframes cclAxoBobK{0%,100%{transform:translateY(0) rotate(-1.1deg)}50%{transform:translateY(-4.5px) rotate(1.3deg)}}
    @keyframes cclAxoBlinkK{0%,88%,100%{transform:scaleY(1)}92%{transform:scaleY(.08)}}
    @media (prefers-reduced-motion:reduce){.cclAxoBob,.cclAxoBlink{animation:none}}
  </style>
