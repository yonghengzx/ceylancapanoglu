<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Robi, the studio robot mascot">
  <title>Robi the robot mascot</title>
  <style>
    .ccl-robot-bob{transform-box:fill-box;transform-origin:50% 92%;animation:cclRobotBob 4.8s ease-in-out infinite}
    .ccl-robot-blink{transform-box:fill-box;transform-origin:50% 50%;animation:cclRobotBlink 4.2s ease-in-out infinite}
    .ccl-robot-wave{transform-box:fill-box;transform-origin:14% 86%;animation:cclRobotWave 2.2s ease-in-out infinite}
    .ccl-robot-spark{transform-box:fill-box;transform-origin:center;animation:cclRobotSpark 2.4s ease-in-out infinite}
    .ccl-robot-antenna{transform-box:fill-box;transform-origin:50% 100%;animation:cclRobotAnt 3.4s ease-in-out infinite}
    @keyframes cclRobotBob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-5px) rotate(1deg)}}
    @keyframes cclRobotBlink{0%,80%,100%{transform:scaleY(1)}85%{transform:scaleY(.08)}91%{transform:scaleY(1)}}
    @keyframes cclRobotWave{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
    @keyframes cclRobotSpark{0%,100%{transform:scale(.7) rotate(0deg);opacity:.6}50%{transform:scale(1.2) rotate(35deg);opacity:1}}
    @keyframes cclRobotAnt{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
    @media (prefers-reduced-motion:reduce){.ccl-robot-bob,.ccl-robot-blink,.ccl-robot-wave,.ccl-robot-spark,.ccl-robot-antenna{animation:none}}
  </style>
  <g class="ccl-robot-bob">
    <ellipse cx="80" cy="149" rx="40" ry="6" fill="#05070d" opacity=".38"/>
    <path d="M50 106c12-7 48-7 60 0l6 42c-16 7-56 7-72 0Z" fill="#7c2d12"/>
    <path d="M50 106c12-7 48-7 60 0l2 14c-14-6-50-6-64 0Z" fill="#f97316" opacity=".45"/>
    <rect x="46" y="104" width="68" height="44" rx="16" fill="#16233c"/>
    <rect x="46" y="104" width="68" height="44" rx="16" fill="none" stroke="#38bdf8" stroke-width="2.4" opacity=".55"/>
    <circle cx="80" cy="120" r="7" fill="#22d3ee"/>
    <circle cx="80" cy="120" r="3" fill="#baeaff"/>
    <path d="M62 136h36M66 142h28" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity=".5"/>
    <g class="ccl-robot-antenna">
      <path d="M80 34V18" stroke="#38bdf8" stroke-width="3.4" stroke-linecap="round"/>
      <circle cx="80" cy="13" r="6" fill="#fbbf24"/>
      <circle cx="80" cy="13" r="2.4" fill="#fff7ed"/>
    </g>
    <rect x="32" y="34" width="96" height="76" rx="22" fill="#101a2e"/>
    <rect x="32" y="34" width="96" height="76" rx="22" fill="none" stroke="#38bdf8" stroke-width="2.6" opacity=".65"/>
    <rect x="43" y="45" width="74" height="54" rx="15" fill="#05070d"/>
    <rect x="43" y="45" width="74" height="54" rx="15" fill="none" stroke="#22d3ee" stroke-width="1.6" opacity=".45"/>
    <g class="ccl-robot-blink">
      <rect x="56" y="60" width="17" height="20" rx="8.5" fill="#22d3ee"/>
      <rect x="87" y="60" width="17" height="20" rx="8.5" fill="#22d3ee"/>
      <circle cx="62" cy="66" r="3.4" fill="#ffffff"/>
      <circle cx="93" cy="66" r="3.4" fill="#ffffff"/>
    </g>
    <rect x="52" y="83" width="13" height="5" rx="2.5" fill="#fb7185" opacity=".55"/>
    <rect x="95" y="83" width="13" height="5" rx="2.5" fill="#fb7185" opacity=".55"/>
    <path d="M66 84h28c0 6-6 10-14 10s-14-4-14-10Z" fill="#38bdf8"/>
    <path d="M70 88h20" stroke="#baeaff" stroke-width="2" stroke-linecap="round" opacity=".7"/>
    <rect x="18" y="58" width="12" height="26" rx="6" fill="#0ea5e9"/>
    <rect x="130" y="58" width="12" height="26" rx="6" fill="#0ea5e9"/>
    <path d="M30 71h4M126 71h4" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
    <g class="ccl-robot-wave">
      <circle cx="124" cy="104" r="8" fill="#101a2e" stroke="#38bdf8" stroke-width="2.2"/>
      <path d="M128 110c7-3 13 0 15 6 2 7-2 13-8 13-6 0-10-5-10-11Z" fill="#16233c" stroke="#38bdf8" stroke-width="2"/>
      <path d="M133 107v-6M138 109v-6" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <g class="ccl-robot-spark">
      <path d="M136 30l1.8 4.8 4.8 1.8-4.8 1.8-1.8 4.8-1.8-4.8-4.8-1.8 4.8-1.8Z" fill="#22d3ee"/>
    </g>
  </g>
</svg>
