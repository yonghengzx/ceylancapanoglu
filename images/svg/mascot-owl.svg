<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Iris the owl mascot">
  <title>Iris the owl mascot</title>
  <style>
    .cclOwlBob{transform-box:fill-box;transform-origin:center;animation:cclOwlBobK 4s ease-in-out infinite}
    .cclOwlBlink{transform-box:fill-box;transform-origin:center;animation:cclOwlBlinkK 6.6s ease-in-out infinite}
    @keyframes cclOwlBobK{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-4px) rotate(1deg)}}
    @keyframes cclOwlBlinkK{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
    @media (prefers-reduced-motion:reduce){.cclOwlBob,.cclOwlBlink{animation:none}}
  </style>
  <ellipse cx="64" cy="121" rx="30" ry="5" fill="#2A2233" opacity=".15"/>
  <g class="cclOwlBob">
    <path d="M40 30 36 8 56 22z" fill="#5B44C4"/>
    <path d="M88 30 92 8 72 22z" fill="#5B44C4"/>
    <path d="M26 64c-6 14-4 30 4 38 4-12 4-28 2-36z" fill="#5B44C4"/>
    <path d="M102 64c6 14 4 30-4 38-4-12-4-28-2-36z" fill="#5B44C4"/>
    <path d="M64 16c24 0 40 20 40 50 0 30-18 50-40 50s-40-20-40-50c0-30 16-50 40-50z" fill="#7A5CFF" stroke="#5B44C4" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="64" cy="84" rx="26" ry="30" fill="#F1EDFF"/>
    <g fill="none" stroke="#C9BDF5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M56 78l8 6 8-6"/>
      <path d="M56 90l8 6 8-6"/>
      <path d="M56 102l8 6 8-6"/>
    </g>
    <circle cx="48" cy="52" r="19" fill="#FAF7FF"/>
    <circle cx="80" cy="52" r="19" fill="#FAF7FF"/>
    <circle cx="33" cy="68" r="5.5" fill="#FF9EAE" opacity=".5"/>
    <circle cx="95" cy="68" r="5.5" fill="#FF9EAE" opacity=".5"/>
    <g class="cclOwlBlink">
      <circle cx="48" cy="52" r="8" fill="#2A2233"/>
      <circle cx="80" cy="52" r="8" fill="#2A2233"/>
      <circle cx="45" cy="49" r="3" fill="#FFFFFF"/>
      <circle cx="77" cy="49" r="3" fill="#FFFFFF"/>
      <circle cx="50.5" cy="54.5" r="1.6" fill="#FFFFFF" opacity=".85"/>
      <circle cx="82.5" cy="54.5" r="1.6" fill="#FFFFFF" opacity=".85"/>
    </g>
    <path d="M58 58h12l-6 12z" fill="#FFC44D" stroke="#E0A02F" stroke-width="2.5" stroke-linejoin="round"/>
    <g stroke="#FFC44D" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M52 112l-4 8"/>
      <path d="M56 112v8"/>
      <path d="M72 112v8"/>
      <path d="M76 112l4 8"/>
    </g>
  </g>
</svg>
